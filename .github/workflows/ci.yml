# CI for AbstractTUI — a pure-Rust library crate plus its sibling-crate
# extension family (ADR-0004 §3: extensions/* are workspace members so
# they ride CI against core HEAD; coupling breaks surface at PR time,
# not release time).
#
# Gates: build + full test suite for the WHOLE WORKSPACE on Linux/macOS,
# lib tests on Windows, clippy (zero warnings, workspace) and rustdoc
# (zero warnings, workspace) on Linux, the live pty suite on Linux
# (backlog 0180), MSRV check at the declared `rust-version`, and a
# semver gate against the latest published release (ADR-0001:
# additive-only between budgeted breaking windows).
#
# Deliberate omissions (see .github/SETUP.md "Follow-ups"):
#   - perf/fuzz/soak remain #[ignore]d here and gate on the SCHEDULED
#     workflow instead (perf.yml, weekly + dispatch — 0180 want #2:
#     timing budgets are load-sensitive and belong on a scheduled
#     quiet-runner job, not per-PR).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  test-unix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets
      - name: Test (workspace)
        # `cargo test` already includes the doctest pass — no separate
        # `cargo test --doc` step (cycle-2 review F13 nit: it ran the
        # doctests twice). `--workspace` runs the extension family
        # against core HEAD (ADR-0004 §3).
        run: cargo test --workspace

  test-windows:
    # The integration-test harness drives real terminals through a unix pty
    # helper (cfg-gated to unix), so the integration suites cannot run on
    # Windows yet. Library unit tests are the Windows gate for now: the
    # crate's Windows backend is exercised by `cargo build --lib` and
    # `cargo test --lib`.
    name: test (windows, lib only)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (lib)
        run: cargo build --lib
      - name: Test (lib)
        run: cargo test --lib

  lint:
    name: lint (clippy + rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check (workspace)
        run: cargo fmt --all --check
      - name: Clippy (deny warnings, workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc (deny warnings, workspace)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # The live pty suite on a Linux runner (backlog 0180): the README's
  # Linux row claims pty coverage, so CI must actually run it. The suite
  # self-hosts through the in-tree pty helper; examples are prebuilt so
  # no case pays a cold cargo build inside its deadline (review R5), and
  # cases run serially per CONTRIBUTING.
  live-pty-linux:
    name: live pty (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prebuild example binaries
        # --workspace: matches what the suite itself builds
        # (ensure_examples_built), so the prebuild covers the extension
        # examples the pty cases drive rather than a narrower set.
        run: cargo build --workspace --examples
      - name: Live pty suite (serial)
        # The lane is #[ignore]d BY DESIGN — it spawns real processes under
        # a real pty, so it must not fire on a bare `cargo test`. That is
        # the right call and it costs this: "the lane never ran" and "the
        # lane passed" are the same exit code. Drop `--ignored` from the
        # line below and this job goes GREEN with zero pty coverage, which
        # is the one thing in this repo that runs an example's paint path.
        #
        # The in-suite skip guard cannot see it: that only fires inside a
        # case that ran. An opt-in gate needs its own receipt, so this is
        # it — the count the lane actually executed, asserted out loud.
        run: |
          set -o pipefail
          cargo test --test live_smoke -- --ignored --test-threads=1 2>&1 | tee live-pty.log
          ran=$(awk '/^test result:/ { n += $4 } END { print n + 0 }' live-pty.log)
          echo "live pty cases executed: $ran (floor $LIVE_PTY_MIN)"
          if [ "$ran" -lt "$LIVE_PTY_MIN" ]; then
            echo "::error::live pty lane executed $ran cases, expected at least" \
                 "$LIVE_PTY_MIN. Either --ignored was dropped (the lane did not" \
                 "run at all and this job was about to report success), or cases" \
                 "were removed and the floor needs a deliberate edit."
            exit 1
          fi
        env:
          # Floor, not the exact count, so adding a case never breaks CI.
          # Sized well under the current lane so a real removal is a
          # deliberate edit here rather than a number that drifts quietly.
          LIVE_PTY_MIN: 20
      - name: RT5 ctty probes (serial)
        run: >-
          cargo test --lib -- --ignored --test-threads=1 --exact
          term::rt5_live_tests::devtty_alias_vs_real_device_poll
          term::rt5_live_tests::engine_keystrokes_flow_on_ctty_path

  # The RT5 probes' Darwin verdict halves (the /dev/tty POLLNVAL root
  # cause) only assert on macOS, so they need a macOS runner. They fork
  # the test binary to give the child a real controlling terminal —
  # which is exactly why they are ignore-gated out of the THREADED
  # default suite: fork from a multithreaded process deadlocks in the
  # parent's atfork handlers on the 2026-08 macos-latest image (the
  # default job hung to its 30-minute timeout, twice). Serial execution
  # parks every other harness thread across the fork.
  live-pty-macos:
    name: live pty (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: RT5 ctty probes (serial)
        run: >-
          cargo test --lib -- --ignored --test-threads=1 --exact
          term::rt5_live_tests::devtty_alias_vs_real_device_poll
          term::rt5_live_tests::engine_keystrokes_flow_on_ctty_path

  # MSRV gate (backlog 0180): the declared `rust-version` in Cargo.toml
  # must actually compile the whole tree. Pinned toolchain, `--locked`
  # so the check runs against the shipped lockfile (lockfile v4 needs
  # cargo >= 1.78; 1.87 reads it natively). Bump policy: raising the
  # floor is a minor-version event, declared in CHANGELOG.
  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check (all targets at the declared floor)
        run: cargo check --all-targets --locked

  # Semver gate (ADR-0001 §2: additive-only between budgeted breaking
  # windows; the 0.3 budget lives in docs/backlog/planned/). Baseline =
  # the latest published release on crates.io (0.2.0 today) — the
  # registry copy is what downstream actually resolves, so it is the
  # honest comparison point. Tool verified locally 2026-07-22
  # (`cargo semver-checks --baseline-version 0.2.0`: 196 checks; it
  # then caught a live in-flight `Role` variant insertion as 2 major
  # findings the same session — see the 0.3 budget doc's enforcement
  # section). A registry outage fails only this job (separate +
  # re-runnable), never the test jobs. An intended break in a budgeted
  # 0.3 window will fail here by design — that failure is the release's
  # cue to bump the version in the same PR, not a gate to soften.
  semver:
    name: semver (vs latest release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-semver-checks (core)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: abstracttui
      # Per ADR-0004 ("the semver gate covers the family once
      # published"): `abstracttui-graph` and `abstracttui-mermaid` have
      # had registry baselines since their 0.2.0 release, so they join
      # the gate here. One step per crate — a red step then names the
      # crate that broke, instead of a single opaque failure.
      - name: cargo-semver-checks (graph)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: abstracttui-graph
      - name: cargo-semver-checks (mermaid)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: abstracttui-mermaid
